# ═══════════════════════════════════════════════════════════════════════════
# Profile `project` — audit of a project generated from this kit
# ═══════════════════════════════════════════════════════════════════════════
#
# ALL repo-specific policy lives HERE (arrays/variables). The checks under
# checks/ are generic and only read these definitions. If you port new checks,
# keep them policy-free and extend this file.
#
# Numbering gaps (checks intentionally absent — they were project-specific
# in the origin framework, e.g. language/toolchain audits):
#   02, 03, 06–16, 20, 22 — operator terms, language toolchain (cargo),
#   per-project URL checks, test-orphan detection. Reuse a free number for
#   project-specific checks you add.

CHECKS=(
    "01_secrets_and_creds"
    "04_web_links"
    "05_docs_crossref"
    "17_docs_sync_markers"
    "18_ai_docs_sync"
    "19_version_sync"
    "21_changelog_coverage"
    "23_private_paths"
    "24_public_doc_refs"
)

# ─── 01_secrets_and_creds ───────────────────────────────────────────────
# Directories (relative to PROJECT_ROOT) and loose files to scan.
SECRET_SCAN_DIRS=(
    "docs"
    "scripts"
)
SECRET_SCAN_FILES=(
    "README.md" "README.es.md" "CHANGELOG.md" "CONTRIBUTING.md"
    "SECURITY.md" "THIRD_PARTY_LICENSES.md"
    "llms.txt" "llms-full.txt"
)

# ─── 04_web_links / 05_docs_crossref ────────────────────────────────────
MD_SCAN_DIRS=("docs")
MD_SCAN_FILES=("README.md" "README.es.md")

# ─── 17_docs_sync_markers ───────────────────────────────────────────────
# Pending-work markers in public docs.
MARKER_SCAN_DIRS=("docs")
MARKER_SCAN_FILES=(
    "README.md" "README.es.md" "CHANGELOG.md" "CONTRIBUTING.md"
    "SECURITY.md" "THIRD_PARTY_LICENSES.md" "llms.txt" "llms-full.txt"
)
# Hits matching this extended regex are filtered out (self-referential
# mentions — docs ABOUT the marker convention). Trade-off accepted on
# purpose: a real marker inside backticks would be missed; backticks signal
# "I am talking about the literal token" while real pending work is written
# in plain prose. Empty = no filtering.
MARKER_IGNORE_RE='`\[PENDIENTE\]`|`\[PENDING\]`|description:.*\[(PENDIENTE|PENDING)\]'

# ─── 24_public_doc_refs ─────────────────────────────────────────────────
# Public docs where rule R2 does not apply (they document the AI-native
# pattern by definition). R1 (References header) allows no exceptions.
#   docs/en|es/ai-native.md — the kit's own tutorial teaches .agents/skills/
#     paths and the public/private split on purpose.
PUBLIC_DOC_PRIVATE_REF_ALLOW=(
    "docs/en/ai-native.md"
    "docs/es/ai-native.md"
)

# Extra public files scanned ONLY by check 24 (MD_SCAN_* is shared with
# checks 04/05 — adding here does not affect them). CHANGELOG.md feeds the
# GitHub release notes: a private path there gets published.
PRIVATE_REF_SCAN_FILES=(
    "CHANGELOG.md"
    "CONTRIBUTING.md"
    "SECURITY.md"
    "THIRD_PARTY_LICENSES.md"
    "llms.txt"
    "llms-full.txt"
)

# R2 hits whose LINE matches this ERE are skipped (same convention and
# trade-off as MARKER_IGNORE_RE in check 17). Covers legitimate mentions of
# feature paths (agent ignore-files, .env as a secrets example). Owner
# internals have no legitimate mention and keep erroring. Empty = filter
# nothing.
PRIVATE_REF_IGNORE_RE='\.agents/|\.claude/|\.codeium/|\.windsurf/|\.devinignore|\.env|forbidden-terms\.conf'

# ─── 18_ai_docs_sync ────────────────────────────────────────────────────
AGENTS_MD="AGENTS.md"
SKILLS_DIR=".agents/skills"
AGENTS_INDEX_RE='\.agents/skills/%s/SKILL\.md'
AGENTS_MD_MAX=120

# ─── 19_version_sync / 21_changelog_coverage ────────────────────────────
# Canonical source: first '## [x.y.z]' in CHANGELOG.md.
# VERSION_TARGETS: "path:kind" — kind ∈ json_version | badge_version |
# current_version. Missing file → warning; missing pattern → warning;
# different value → error. The SAME list is the propagation allowlist of
# scripts/dev/sync_version.sh.
VERSION_TARGETS=(
    "config.json:json_version"
    "README.md:badge_version"
    "README.es.md:badge_version"
    "llms-full.txt:current_version"
)
# File whose "version" key must be covered by the CHANGELOG (21).
VERSION_FILE="config.json"

# ─── 23_private_paths ───────────────────────────────────────────────────
# NOTE: REQUIRED_GITIGNORE, PRIVATE_GLOBS and PUBLIC_EXCEPTIONS are DUPLICATED
# in the rendered hook scripts/git/pre-commit (this profile is private and a
# clean clone does not have it). Keep in sync with scripts/git/pre-commit.
# Deliberate exception: globs whose very NAME is private go ONLY here — the
# hook is public and gets those terms at runtime from the gitignored
# FORBIDDEN_TERMS_FILE (same conf feeds commit-msg and pre-push).
# Literal lines that MUST exist in .gitignore (worktree and staged).
REQUIRED_GITIGNORE=(
# >>> startai:if-ai-private >>>
    '**/AGENTS.md'
    '.agents/'
    'CLAUDE.md'
    '.claude/'
# <<< startai:endif <<<
    '.devin/'
    '.devinignore'
    '.codeium/'
    '.windsurf/'
    'NOTES.md'
    'MEGAPLAN-*.md'
    'config.json'
    'docs/dev/'
    'scripts/dev/'
    'security-audit/'
    '*.key'
    '*.pem'
    '.env'
)

# Bash globs of paths that must NEVER appear in git ls-files.
# Each glob is tried verbatim and as "<dir>/**/glob" (equivalent to
# unanchored .gitignore matching).
PRIVATE_GLOBS=(
# >>> startai:if-ai-private >>>
    'AGENTS.md'
    '.agents/*'
    'CLAUDE.md'
    '.claude/*'
# <<< startai:endif <<<
    '.devin/*'
    '.devinignore'
    '.codeium/*'
    '.codeiumignore'
    '.windsurf/*'
    '.windsurfignore'
    'NOTES.md'
    'MEGAPLAN-*.md'
    'history_*.md'
    'config.json'
    'docs/dev/*'
    'scripts/dev/*'
    'security-audit/*'
    '*.key'
    '*.pem'
    '*.p12'
    '*.pfx'
    '.env'
    '.env.*'
    'minisign.key'
    # Local adopt state (like config.json). Deliberately NOT in
    # REQUIRED_GITIGNORE: adopting the kit must not add a new hard gate —
    # blocking the path if tracked is enough.
    '.startai-adopt.json'
)

# Public exceptions (none: a generated project has no templates/ dir).
PUBLIC_EXCEPTIONS=()

# .devinignore files to audit (must never negate secrets).
DEVINIGNORE_FILES=(".devinignore")

# Forbidden-terms conf for check 23.5 (repo-relative or absolute path).
# The file itself must be gitignored (under scripts/dev/ is covered) —
# private terms can't live in versioned files. Missing/empty → skipped.
# Env override: STARTAI_PRIVATE_TERMS_FILE.
FORBIDDEN_TERMS_FILE="scripts/dev/forbidden-terms.conf"
